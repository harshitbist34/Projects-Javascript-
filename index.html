<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Spotify - Elevate Every Moment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <ul>
            <li class="brand"><img src = "logo.png" alt="Spotify">Spotify </li>
            <li>Home</li>
            <li>About</li>
        </ul>
    </nav>
    <div class="container">
        
        <div class="songlist">
            <h1>BEST OF NCS -No Copyright sound</h1>
        </div>
        <div class="songbanner"></div>
    </div>

    <div class="bottom">
        <input type="range" name="Range" id="myProgressBar" min ="0" max="100">
        <div class="icons">
            <i class = "fa-solid fa-backward fa-2x"> </i>
            <i class="fa-solid fa-circle-play play-btn fa-2x"></i>
            <i class="fa-solid fa-forward fa-2x"></i>
        </div>
    </div>


    <script src="https://kit.fontawesome.com/c039971054.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
